services:
  jellyfin:
    image: jellyfin/jellyfin:12.1
    container_name: jellyfin
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:8096:8096"
    environment:
      TZ: Europe/Paris
      JELLYFIN_PublishedServerUrl: https://jellyfin.elyazid.dev
    volumes:
      - ./data/config:/config
      - ./data/cache:/cache
      - /home/elyazid/jellyfin:/media:ro
