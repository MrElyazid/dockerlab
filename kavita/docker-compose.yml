services:
  kavita:
    image: linuxserver/kavita:version-v0.9.1.4
    container_name: kavita
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:5000"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Paris
    volumes:
      - ./data/config:/config
      - /home/elyazid/books:/books:ro
