# the env vars needed are :
# POSTGRES_USER
# POSTGRES_PASSWORD
services:
  database:
    image: postgres:18.6-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=hedgedoc
    volumes:
      - ./data/postgres:/var/lib/postgresql
    restart: always
  app:
    image: quay.io/hedgedoc/hedgedoc:1.12.0
    environment:
      - CMD_DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/hedgedoc
      - CMD_DOMAIN=hedgedoc.elyazid.dev
      - CMD_URL_ADDPORT=false
      - CMD_PROTOCOL_USESSL=true
      - CMD_SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - ./data/uploads:/hedgedoc/public/uploads
    ports:
      - "127.0.0.1:3000:3000"
    restart: always
    depends_on:
      - database
